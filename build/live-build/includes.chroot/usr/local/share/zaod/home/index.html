<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zaod OS</title>
<style>
  :root{
    --ink:#12141c; --muted:#6b7280; --line:#e8eaf2;
    --card:#ffffff; --bg:#f7f8fc; --accent:#5b69be;
    --shadow:0 1px 2px rgba(20,24,45,.04),0 12px 30px -18px rgba(20,24,45,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:"Inter","DejaVu Sans",system-ui,-apple-system,sans-serif;
    color:var(--ink); background:
      radial-gradient(1100px 520px at 12% -10%, #eef1ff 0%, rgba(255,255,255,0) 60%),
      radial-gradient(900px 520px at 92% 6%, #f0f7ff 0%, rgba(255,255,255,0) 55%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:44px 26px 56px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:34px}
  .brand{display:flex;align-items:center;gap:13px}
  .mark{width:42px;height:42px;border-radius:13px;border:1.5px solid var(--line);background:#fff;
        box-shadow:var(--shadow);display:grid;place-items:center}
  .mark svg{width:20px;height:20px}
  h1{font-size:19px;letter-spacing:-.2px;margin:0;font-weight:650}
  .sub{font-size:12px;color:var(--muted);margin-top:2px;letter-spacing:.02em}
  .clock{text-align:right}
  .time{font-size:30px;font-weight:600;letter-spacing:-1px;line-height:1}
  .date{font-size:12px;color:var(--muted);margin-top:5px}
  .label{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);
         margin:0 0 12px 2px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px;margin-bottom:30px}
  .tile{
    position:relative;display:flex;flex-direction:column;gap:11px;
    padding:16px 15px 14px;border:1px solid var(--line);border-radius:16px;
    background:var(--card);text-decoration:none;color:var(--ink);
    box-shadow:var(--shadow);cursor:pointer;
    transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s,border-color .22s;
    opacity:0;transform:translateY(10px);animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards;
    text-align:left;font:inherit;width:100%;
  }
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .tile:hover{transform:translateY(-3px);border-color:#d9deef;
    box-shadow:0 2px 4px rgba(20,24,45,.05),0 20px 34px -22px rgba(20,24,45,.45)}
  .tile:active{transform:translateY(-1px) scale(.995)}
  .tile:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#f4f6fd;border:1px solid #eceffa}
  .ic svg{width:19px;height:19px}
  .nm{font-size:13.5px;font-weight:600;letter-spacing:-.1px}
  .ds{font-size:11px;color:var(--muted);margin-top:-6px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);opacity:0;
    background:#12141c;color:#fff;font-size:12px;padding:9px 15px;border-radius:10px;
    transition:opacity .25s,transform .25s;pointer-events:none}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  footer{margin-top:6px;font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center}
  .dot{width:5px;height:5px;border-radius:50%;background:#8fbf9a}
  @media (max-width:520px){
    .wrap{padding:26px 16px 40px}
    header{flex-direction:column;align-items:flex-start;gap:14px}
    .clock{text-align:left}
    .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:11px}
  }
  @media (prefers-reduced-motion:reduce){
    .tile{animation:none;opacity:1;transform:none;transition:none}
    .tile:hover{transform:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#5b69be" stroke-width="2" stroke-linecap="round">
          <path d="M4 16c2.6-7 5.4-7 8 0s5.4 7 8 0"/>
        </svg>
      </div>
      <div>
        <h1>Zaod OS</h1>
        <div class="sub">Home</div>
      </div>
    </div>
    <div class="clock">
      <div class="time" id="time">--:--</div>
      <div class="date" id="date"></div>
    </div>
  </header>

  <p class="label">Web</p>
  <div class="grid">
    <a class="tile" href="https://www.youtube.com" target="_blank" rel="noreferrer" style="animation-delay:.02s">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#d93025" stroke-width="1.8" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="4"/><path d="M10.5 9.5l4.5 2.5-4.5 2.5z" fill="#d93025" stroke="none"/></svg></span>
      <span class="nm">YouTube</span><span class="ds">video</span>
    </a>
    <a class="tile" href="https://web.whatsapp.com" target="_blank" rel="noreferrer" style="animation-delay:.06s">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#1f9d63" stroke-width="1.8" stroke-linecap="round"><path d="M20 11.8a8 8 0 0 1-11.8 7L4 20l1.2-4.2A8 8 0 1 1 20 11.8z"/><path d="M9.3 9.4c.3 2 2 3.7 4.1 4.1"/></svg></span>
      <span class="nm">WhatsApp</span><span class="ds">messages</span>
    </a>
    <a class="tile" href="https://www.instagram.com" target="_blank" rel="noreferrer" style="animation-delay:.1s">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#c13584" stroke-width="1.8"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r="1.1" fill="#c13584" stroke="none"/></svg></span>
      <span class="nm">Instagram</span><span class="ds">social</span>
    </a>
    <a class="tile" href="https://www.facebook.com" target="_blank" rel="noreferrer" style="animation-delay:.14s">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#1877f2" stroke-width="1.9" stroke-linecap="round"><path d="M14.5 8.5h2M14.5 8.5V7c0-.8.4-1.5 1.5-1.5H18"/><path d="M14.5 8.5V21"/><path d="M10.5 12.5h6"/></svg></span>
      <span class="nm">Facebook</span><span class="ds">social</span>
    </a>
    <a class="tile" href="https://www.tiktok.com" target="_blank" rel="noreferrer" style="animation-delay:.18s">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#12141c" stroke-width="1.8" stroke-linecap="round"><path d="M14 4v10.2a3.4 3.4 0 1 1-3.4-3.4"/><path d="M14 4c.4 2.4 2 4 4.4 4.2"/></svg></span>
      <span class="nm">TikTok</span><span class="ds">video</span>
    </a>
  </div>

  <p class="label">Device</p>
  <div class="grid">
    <button class="tile" data-app="files" style="animation-delay:.22s">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#5b69be" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h4l2 2.5h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg></span>
      <span class="nm">Files</span><span class="ds">storage</span>
    </button>
    <button class="tile" data-app="camera" style="animation-delay:.25s">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#5b69be" stroke-width="1.8"><rect x="3" y="7" width="18" height="12" rx="3"/><circle cx="12" cy="13" r="3.2"/><path d="M8.5 7l1.2-2h4.6l1.2 2"/></svg></span>
      <span class="nm">Camera</span><span class="ds">webcam</span>
    </button>
    <button class="tile" data-app="wifi" style="animation-delay:.28s">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#5b69be" stroke-width="1.8" stroke-linecap="round"><path d="M3 8.5a14 14 0 0 1 18 0"/><path d="M6.2 12a9.4 9.4 0 0 1 11.6 0"/><path d="M9.4 15.4a4.7 4.7 0 0 1 5.2 0"/><circle cx="12" cy="18.6" r="1.1" fill="#5b69be" stroke="none"/></svg></span>
      <span class="nm">Wi-Fi</span><span class="ds">network</span>
    </button>
    <button class="tile" data-app="bluetooth" style="animation-delay:.31s">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#5b69be" stroke-width="1.8" stroke-linejoin="round"><path d="M9 6.5l6 5.2-6 5.3V6.5z"/><path d="M9 12h6"/></svg></span>
      <span class="nm">Bluetooth</span><span class="ds">devices</span>
    </button>
    <button class="tile" data-app="settings" style="animation-delay:.34s">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#5b69be" stroke-width="1.7"><circle cx="12" cy="12" r="3.1"/><path d="M12 3.5v2.2M12 18.3v2.2M4.8 12H7M17 12h2.2M6.9 6.9l1.6 1.6M15.5 15.5l1.6 1.6M17.1 6.9l-1.6 1.6M8.5 15.5l-1.6 1.6"/></svg></span>
      <span class="nm">Settings</span><span class="ds">system</span>
    </button>
    <button class="tile" data-app="terminal" style="animation-delay:.37s">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#5b69be" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M7 10l2.6 2.3L7 14.6M12.4 15h4.4"/></svg></span>
      <span class="nm">Terminal</span><span class="ds">shell</span>
    </button>
  </div>

  <footer><span class="dot"></span><span>Zaod OS 1.0 &middot; Debian 12 base &middot; live session</span></footer>
</div>
<div class="toast" id="toast"></div>
<script>
  const pad = n => String(n).padStart(2, "0");
  function tick(){
    const d = new Date();
    document.getElementById("time").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
    document.getElementById("date").textContent = d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  }
  tick(); setInterval(tick, 15000);

  const toast = document.getElementById("toast");
  let toastTimer;
  function say(msg){
    toast.textContent = msg; toast.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("on"), 1800);
  }
  document.querySelectorAll("[data-app]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const app = btn.dataset.app;
      try{
        const res = await fetch("/api/launch", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({app})
        });
        say(res.ok ? "Opening " + app + "…" : "Could not open " + app);
      } catch(e){ say("Launcher service unreachable"); }
    });
  });
</script>
</body>
</html>
