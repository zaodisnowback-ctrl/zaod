name: Build Zaod OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build/live-build/**'
      - 'scripts/build-zaod-liveiso.sh'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: write

concurrency:
  group: zaod-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo swapoff -a || true
          for p in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost; do
            [ -d "$p" ] && sudo find "$p" -mindepth 1 -delete || true
          done
          sudo apt-get clean
          df -h /

      - name: Install live-build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools \
            isolinux syslinux-common syslinux-efi \
            grub-efi-amd64-bin grub-pc-bin mtools dosfstools \
            debian-archive-keyring zstd
          lb --version

      - name: Build ISO
        id: build
        env:
          WORK: /mnt/zaod-build
        run: |
          sudo --preserve-env=WORK,GITHUB_OUTPUT bash scripts/build-zaod-liveiso.sh

      - name: Report ISO
        id: iso
        run: |
          iso="$(find /mnt/zaod-build -maxdepth 1 -name '*.iso' -print -quit)"
          if [ -z "$iso" ]; then
            echo "::error::no ISO produced"
            tail -80 /mnt/zaod-build/build.log || true
            exit 1
          fi
          echo "path=$iso" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$iso")" >> "$GITHUB_OUTPUT"
          du -h "$iso"
          sha256sum "$iso"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: zaod-os-iso
          path: |
            ${{ steps.iso.outputs.path }}
            ${{ steps.iso.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish ISO release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zaod-os-${{ github.run_number }}
          name: Zaod OS build ${{ github.run_number }}
          body: |
            Zaod OS live ISO (Debian 12 + XFCE, white Zaod theme).

            Targets old laptops: 2 GB RAM, 8 GB storage, Intel HD graphics.
            Includes Chromium, WhatsApp/YouTube/Instagram/Facebook/TikTok web apps,
            file manager, camera, Wi-Fi and Bluetooth.
          files: |
            ${{ steps.iso.outputs.path }}
            ${{ steps.iso.outputs.path }}.sha256
          fail_on_unmatched_files: true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /mnt/zaod-build/build.log
          if-no-files-found: ignore
